<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beam Shutter Measurement Search</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    :root { --primary:#123c8c; --bg:#f4f7fb; --card:#fff; --text:#172033; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial,"Noto Sans Bengali",sans-serif; background:var(--bg); color:var(--text); }
    .container { max-width:1100px; margin:auto; padding:18px; }
    .hero { background:linear-gradient(135deg,#123c8c,#1e63c6); color:white; padding:24px; border-radius:18px; margin-bottom:18px; }
    .hero h1 { margin:0 0 8px; font-size:clamp(22px,4vw,36px); }
    .hero p { margin:0; opacity:.9; }
    .card { background:var(--card); border-radius:16px; padding:18px; margin-bottom:18px; box-shadow:0 5px 20px #183b6514; }
    .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
    label { display:block; font-weight:700; margin-bottom:6px; }
    input { width:100%; padding:13px; border:1px solid #ccd5e2; border-radius:10px; font-size:16px; }
    button { border:0; border-radius:10px; padding:12px 18px; font-size:15px; font-weight:700; cursor:pointer; }
    .btn-primary { background:var(--primary); color:#fff; }
    .btn-light { background:#e8eef8; color:#17345f; }
    .actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
    .status { margin-top:12px; color:#526174; font-size:14px; }
    .summary { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:14px; }
    .pill { background:#edf4ff; color:#174b9c; padding:9px 12px; border-radius:999px; font-weight:700; font-size:14px; }
    .table-wrap { overflow:auto; border:1px solid #e1e7ef; border-radius:12px; }
    table { width:100%; border-collapse:collapse; min-width:650px; }
    th { background:var(--primary); color:white; position:sticky; top:0; }
    th, td { padding:11px 10px; border-bottom:1px solid #e6ebf2; text-align:center; white-space:nowrap; }
    tr:nth-child(even) td { background:#f8fbff; }
    .empty { padding:28px; text-align:center; color:#68778b; }
    .file-box { border:1px dashed #9eb1cb; padding:14px; border-radius:12px; background:#f8fbff; }
    @media(max-width:700px) { .grid { grid-template-columns:1fr; } .container { padding:10px; } .hero,.card { border-radius:12px; padding:15px; } }
  </style>
</head>
<body>
  <main class="container">
    <section class="hero">
      <h1>GROUND FLOOR ROOF BEAM SHUTTER SEARCH</h1>
      <p>FB-S/L + Shutter D/L + Shutter D/W দিয়ে সঠিক ডাটা খুঁজুন</p>
    </section>

    <section class="card">
      <h2>সার্চ বক্স</h2>
      <div class="grid">
        <div>
          <label for="fb">FB-S/L</label>
          <input id="fb" placeholder="যেমন: 101 বা 106-(A)" />
        </div>
        <div>
          <label for="dl">Shutter D/L</label>
          <input id="dl" placeholder="যেমন: 1.800" inputmode="decimal" />
        </div>
        <div>
          <label for="dw">Shutter D/W</label>
          <input id="dw" placeholder="যেমন: 0.300" inputmode="decimal" />
        </div>
      </div>
      <div class="actions">
        <button class="btn-primary" id="searchBtn">সার্চ করুন</button>
        <button class="btn-light" id="clearBtn">ক্লিয়ার</button>
      </div>
      <div class="status" id="status">CSV ফাইল লোড হচ্ছে...</div>
    </section>

    <section class="card">
      <div class="summary" id="summary"></div>
      <div class="table-wrap" id="resultBox">
        <div class="empty">তিনটি তথ্য লিখে সার্চ করুন।</div>
      </div>
    </section>

    <section class="card">
      <h3>CSV ফাইল লোড করার বিকল্প পদ্ধতি</h3>
      <p>তথ্য মিলিয়ে দেখুন <b></b>ফোরম্যান: সোহানুর রহমান সোহান </p>
      <div class="file-box">
        <label for="csvFile">প্রয়োজনে CSV ফাইল নির্বাচন করুন</label>
        <input id="csvFile" type="file" accept=".csv,text/csv" />
      </div>
    </section>
  </main>

<script>
  const CSV_FILE = "Floor Beam.csv";
  let records = [];

  const $ = (id) => document.getElementById(id);
  const clean = (value) => String(value ?? "").trim().replace(/^"|"$/g, "");
  const norm = (value) => clean(value).replace(/\s+/g, "").toLowerCase();
  const num = (value) => {
    const n = Number(clean(value));
    return Number.isFinite(n) ? n : null;
  };

  function addRecord(target, fb, dl, dw, qty, sqm) {
    if (!fb || num(dl) === null || num(dw) === null || num(qty) === null || num(sqm) === null) return;
    target.push({
      fb: clean(fb),
      dl: num(dl),
      dw: num(dw),
      qty: num(qty),
      sqm: num(sqm)
    });
  }

  // CSV-তে দুই পাশে পাশাপাশি টেবিল আছে:
  // বাম টেবিল = columns 0-4, ডান টেবিল = columns 6-10
  function convertCsvRows(rows) {
    const result = [];
    [0, 6].forEach(start => {
      let currentFb = "";
      rows.forEach(row => {
        const fbCell = clean(row[start]);
        const dl = row[start + 1];
        const dw = row[start + 2];
        const qty = row[start + 3];
        const sqm = row[start + 4];

        if (!fbCell || norm(fbCell) === "fb-s/l") {
          if (norm(fbCell) === "fb-s/l") return;
        } else {
          currentFb = fbCell;
        }
        addRecord(result, currentFb, dl, dw, qty, sqm);
      });
    });
    return result;
  }

  function loadRows(rows, sourceName) {
    records = convertCsvRows(rows);
    $("status").textContent = `${sourceName} লোড হয়েছে। মোট ${records.length}টি মাপ পাওয়া গেছে।`;
    $("resultBox").innerHTML = '<div class="empty">তিনটি তথ্য লিখে সার্চ করুন।</div>';
    $("summary").innerHTML = "";
  }

  function loadFromText(text, sourceName) {
    Papa.parse(text, {
      skipEmptyLines: false,
      complete: result => loadRows(result.data, sourceName),
      error: error => $("status").textContent = "CSV পড়তে সমস্যা হয়েছে: " + error.message
    });
  }

  async function autoLoadCsv() {
    try {
      const response = await fetch(CSV_FILE);
      if (!response.ok) throw new Error("CSV পাওয়া যায়নি");
      loadFromText(await response.text(), CSV_FILE);
    } catch (error) {
      $("status").textContent = "CSV অটো-লোড হয়নি। নিচের File নির্বাচন করে CSV দিন।";
    }
  }

  function formatNumber(value) {
    return Number(value).toFixed(6).replace(/0+$/, "").replace(/\.$/, "");
  }

  function runSearch() {
    const fb = norm($("fb").value);
    const dl = num($("dl").value);
    const dw = num($("dw").value);

    if (!fb || dl === null || dw === null) {
      $("summary").innerHTML = "";
      $("resultBox").innerHTML = '<div class="empty">FB-S/L, Shutter D/L এবং Shutter D/W—তিনটি তথ্য পূরণ করুন।</div>';
      return;
    }

    const matches = records.filter(r =>
      norm(r.fb) === fb &&
      Math.abs(r.dl - dl) < 0.000001 &&
      Math.abs(r.dw - dw) < 0.000001
    );

    if (!matches.length) {
      $("summary").innerHTML = "";
      $("resultBox").innerHTML = '<div class="empty">কোনো সঠিক ডাটা পাওয়া যায়নি।</div>';
      return;
    }

    const totalQty = matches.reduce((sum, r) => sum + r.qty, 0);
    const totalSqm = matches.reduce((sum, r) => sum + r.sqm, 0);

    $("summary").innerHTML = `
      <span class="pill">রেকর্ড: ${matches.length}</span>
      <span class="pill">মোট Pcs: ${formatNumber(totalQty)}</span>
      <span class="pill">মোট Square M: ${formatNumber(totalSqm)}</span>
    `;

    $("resultBox").innerHTML = `
      <table>
        <thead>
          <tr>
            <th>FB-S/L</th>
            <th>Shutter D/L</th>
            <th>Shutter D/W</th>
            <th>Quantity(Pcs)</th>
            <th>Square M</th>
          </tr>
        </thead>
        <tbody>
          ${matches.map(r => `
            <tr>
              <td>${escapeHtml(r.fb)}</td>
              <td>${formatNumber(r.dl)}</td>
              <td>${formatNumber(r.dw)}</td>
              <td>${formatNumber(r.qty)}</td>
              <td>${formatNumber(r.sqm)}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, ch => ({
      "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
    }[ch]));
  }

  $("searchBtn").addEventListener("click", runSearch);
  ["fb", "dl", "dw"].forEach(id => $(id).addEventListener("keydown", e => {
    if (e.key === "Enter") runSearch();
  }));

  $("clearBtn").addEventListener("click", () => {
    $("fb").value = "";
    $("dl").value = "";
    $("dw").value = "";
    $("summary").innerHTML = "";
    $("resultBox").innerHTML = '<div class="empty">তিনটি তথ্য লিখে সার্চ করুন।</div>';
  });

  $("csvFile").addEventListener("change", event => {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => loadFromText(e.target.result, file.name);
    reader.readAsText(file, "UTF-8");
  });

  autoLoadCsv();
</script>
</body>
  </html>
